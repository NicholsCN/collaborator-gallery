      color: #555;
      font-family: inherit;

    .pw {

      border-radius: 2px;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;

      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .pw:hover .xh { opacity: 1; }

    .xh {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

      font-size: 14px;
      color: #444;
      line-height: 1.85;
      max-width: 560px;
      margin-bottom: 1rem;

    .sn { font-size: 13px; font-weight: 600; color: #111; }
    .sl { font-size: 12px; color: #0066cc; text-decoration: none; }

      padding: 3px 11px;
      border: 1px solid #ddd;
      border-radius: 2px;
      color: #777;

    .pview { max-width: 780px; margin: 0 auto; padding: 3rem 2rem 6rem; }

    .vbk {
      font-size: 13px;
      color: #0066cc;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 2rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;

    .vsb { font-size: 12px; color: #999; margin-bottom: 1.25rem; }

    .vpdf {
      display: inline-block;
      font-size: 13px;
      color: #0066cc;
      text-decoration: none;
      margin-bottom: 1.25rem;

      background: #fff;

    <text x='38' y='174' font-size='10' fill='#4a7040' font-family='system-ui,sans-serif'>Concept to reality in under 4 months.</text>
    <rect x='20' y='194' width='260' height='46' rx='3' fill='#fff' stroke='#90c878' stroke-width='1'/>
    <text x='38' y='214' font-size='13' font-weight='700' fill='#2a5020' font-family='system-ui,sans-serif'>Initiative can be taught.</text>
    <text x='38' y='230' font-size='10' fill='#4a7040' font-family='system-ui,sans-serif'>And mentored. And chosen.</text>
    <rect x='20' y='250' width='260' height='60' rx='3' fill='#2a5020'/>
    <text x='38' y='272' font-size='11' font-weight='700' fill='#c8e8b8' font-family='system-ui,sans-serif'>Students are not passive</text>
    <text x='38' y='288' font-size='11' font-weight='700' fill='#c8e8b8' font-family='system-ui,sans-serif'>participants in their learning.</text>
    <text x='38' y='302' font-size='10' fill='#90c878' font-family='system-ui,sans-serif'>They are active contributors.</text>
    <line x1='20' y1='325' x2='280' y2='325' stroke='#90c878' stroke-width='0.75' opacity='0.5'/>
    <text x='150' y='344' text-anchor='middle' font-size='10' fill='#3a6030' font-family='system-ui,sans-serif'>Presented at NCUR to university professors</text>
    <text x='150' y='358' text-anchor='middle' font-size='10' fill='#3a6030' font-family='system-ui,sans-serif'>as a model for student-driven course design.</text>
    <rect x='0' y='372' width='300' height='28' fill='#3a6a30' opacity='0.1'/>
    <text x='150' y='390' text-anchor='middle' font-size='9' fill='#3a6030' font-family='system-ui,sans-serif'>Aspiring Educators to Advocates · Pedagogy · NCUR</text>
  </svg>`

};


/* =============================================
   PROJECT DATA
   To add a new project, copy one of these blocks
   and paste it before the closing ] bracket.
   Change the fields to match your new project.

   FIELDS:
   - id: give each project a unique number
   - sem: the semester label, e.g. 'Fall 2025'
   - title: the project title
   - who: contributor name(s)
   - li: a URL for LinkedIn or website, or null
   - tags: one or more of ['Pedagogy','Community','Programs']
   - note: your curator text (use \' for apostrophes)
   - panels: list of panel keys from SVG above
   - pdfs: list of PDF file paths, one per panel
           e.g. ['panels/project-panel-1.pdf', ...]
           or null if no PDF yet
============================================= */

const P = [

  {
    id: 1,
    sem: 'Spring 2025',
    title: 'Making Ideas Tangible',
    who: 'Dr. Constance Nichols',
    li: 'https://cnicholseduc.com',
    tags: ['Pedagogy'],
    note: "When students stopped engaging with digital handouts, the answer was not better handouts — it was a different kind of object altogether. A zine for one assignment. A paper mountain for vocabulary. A multi-directional fold for disciplinary literacy. Each artifact made an abstract concept physical, and modeled for students the kind of creative thinking being asked of them.",
    panels: ['t1', 't2', 't3'],
    pdfs: [null, null, null]
  },

  {
    id: 2,
    sem: 'Fall 2024',
    title: 'From Aspiring Educators to Advocates for Leadership and Change',
    who: 'Dobransky · Brungard · Thomas · Beauchamp · Foore · Lane',
    li: null,
    tags: ['Pedagogy', 'Community'],
    note: 'A highlight of student-presented work at the <a href="https://www.cur.org/engage/ncur/" target="_blank">National Conference on Undergraduate Research</a>. The focus was on demonstrating to other university professors the power of student agency and choice in course design and projects.',
    panels: ['n1', 'n2', 'n3'],
    pdfs: [null, null, null]
  }

  /* ADD NEW PROJECTS ABOVE THIS LINE */

];


/* =============================================
   TAG LIST
   These are the browse filter buttons.
   If you add a new tag to a project above,
   add the same word here too.
============================================= */

const TAGS = ['Pedagogy', 'Community', 'Programs'];


/* =============================================
   GALLERY ENGINE
   You do not need to edit below this line.
============================================= */

let activeTag = null;
let view = 'gallery';
let openProj = null;
let openIdx = 0;

function renderGallery() {
  const filtered = activeTag ? P.filter(p => p.tags.includes(activeTag)) : P;
  const sems = [...new Set(filtered.map(p => p.sem))];

  let h = `<div class="g">
    <div class="gh">
      <div class="gt">Teach,<br><span>Create,</span><br>Celebrate</div>
      <div class="gd">
        <p>Hi! Thank you for visiting this site, a place designed to showcase and celebrate the work of students, educators, and community partners. You can think of this as part gallery, part workshop.</p>
        <p>In many of my courses and in my community work I have learned to embrace the philosophy of Teach, Create, Celebrate. An idea I learned from the great Bill Strickland. When you embrace this idea amazing things happen in classrooms, schools, and communities. I get a front row seat to this process, and often think, "more people should know about this!" With that in mind I have created this little corner of the internet as a kind of "digital commons". It's a place where we can share the endeavors (large and small) that impact schools, communities, or teacher practice.</p>
        <p>On behalf of my collaborators, thank you for taking the time to explore and celebrate this work — and all the potential it represents moving forward.</p>
      </div>
    </div>
    <div class="fi">
      <span class="fp">Browse:</span>`;

  ['All', ...TAGS].forEach((t, i) => {
    const real = i === 0 ? null : t;
    h += `<button class="fb${activeTag === real ? ' on' : ''}" data-t="${real || ''}">${t}</button>`;
  });

  h += `</div>`;

  sems.forEach((sem, si) => {
    if (si > 0) h += `<div class="dv"></div>`;
    h += `<p class="sm">${sem}</p>`;

    filtered.filter(p => p.sem === sem).forEach(p => {
      const chips = p.tags.map(t => `<span class="ck">${t}</span>`).join('');
      const li = p.li ? `<a href="${p.li}" class="sl" target="_blank">Website ↗</a>` : '';
      const panels = p.panels.map((k, i) => `
        <div class="pw" data-id="${p.id}" data-i="${i}">
          <div class="pi">${SVG[k]}</div>
          <span class="xh">expand</span>
        </div>`).join('');

      h += `<div class="pj">
        <div class="ch">${chips}</div>
        <div class="pt">${p.title}</div>
        <div class="ps">${panels}</div>
        <p class="no">${p.note}</p>
        <div class="sr"><span class="sn">${p.who}</span>${li}</div>
      </div>`;
    });
  });

  h += `</div>`;
  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('.fb').forEach(b => {
    b.onclick = () => { activeTag = b.dataset.t || null; renderGallery(); };
  });

  document.querySelectorAll('.pw').forEach(el => {
    el.onclick = () => {
      openProj = P.find(p => p.id === parseInt(el.dataset.id));
      openIdx = parseInt(el.dataset.i);
      view = 'panel';
      renderPanel();
    };
  });
}

function renderPanel() {
  const p = openProj;
  const count = p.panels.length;
  const pdfLink = p.pdfs && p.pdfs[openIdx]
    ? `<a href="${p.pdfs[openIdx]}" class="vpdf" target="_blank">View full size / PDF ↗</a>`
    : `<span class="vpdf" style="color:#999;">PDF coming soon</span>`;

  const h = `<div class="pview">
    <button class="vbk" id="vb">← Back to gallery</button>
    <div class="vp">${SVG[p.panels[openIdx]]}</div>
    <div class="vtl">${p.title}</div>
    <div class="vsb">Panel ${openIdx + 1} of ${count} · ${p.who}</div>
    ${pdfLink}
    <div class="vn">
      <button class="vnb" id="vp" ${openIdx === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="vnb" id="vn" ${openIdx === count - 1 ? 'disabled' : ''}>Next →</button>
    </div>
  </div>`;

  document.getElementById('app').innerHTML = h;

  document.getElementById('vb').onclick = () => { view = 'gallery'; renderGallery(); };
  const prev = document.getElementById('vp');
  const next = document.getElementById('vn');
  if (prev) prev.onclick = () => { if (openIdx > 0) { openIdx--; renderPanel(); } };
  if (next) next.onclick = () => { if (openIdx < count - 1) { openIdx++; renderPanel(); } };
}

renderGallery();

</script>
</body>
</html>
